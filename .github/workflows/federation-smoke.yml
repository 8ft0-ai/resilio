name: Federation smoke

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  require-main:
    name: require-trusted-main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require trusted main
        run: test "$GITHUB_REF" = "refs/heads/main"

  authenticate:
    name: trusted-main-auth
    needs: require-main
