name: Phase 4 evidence

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Existing trusted Cloud Build ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  require-main:
    name: require-trusted-main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require trusted main
        run: test "$GITHUB_REF" = "refs/heads/main"

  evidence:
    name: adjudicate-exact-build
    needs: require-main
    permissions:
      contents: read
      issues: read
      id-token: write
    uses: 8ft0-ai/resilio/.github/workflows/phase4-evidence-reusable.yml@1e11ec355a78fcf114e0c761b54412671afcfe29
    with:
      build_id: ${{ inputs.build_id }}
