name: Phase 4 trusted build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  require-main:
    name: require-trusted-main
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require trusted main
        run: test "$GITHUB_REF" = "refs/heads/main"

  build:
    name: trusted-build
    needs: require-main
    permissions:
      contents: read
      id-token: write
