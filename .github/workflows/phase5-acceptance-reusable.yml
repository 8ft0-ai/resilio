name: Phase 5 first-slice acceptance reusable

on:
  workflow_call:
    inputs:
      release_record_comment_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  acceptance:
    name: prove-ingest-transport-persistence-readback-and-replay
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Check out immutable Slice A control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Bind reviewed release and Phase 4-derived event before OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RECORD_COMMENT_ID: ${{ inputs.release_record_comment_id }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "8ft0-ai/resilio"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          [[ "$RELEASE_RECORD_COMMENT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$RELEASE_RECORD_COMMENT_ID" > "$RUNNER_TEMP/release-record.json"
          python3 scripts/phase5_release_record.py validate \
            --comment-json "$RUNNER_TEMP/release-record.json" --comment-id "$RELEASE_RECORD_COMMENT_ID" \
            --output "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-meta.json"
          RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' "$RUNNER_TEMP/release-meta.json")"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["control_sha"])' "$RUNNER_TEMP/release.json")" = "$CONTROL_SHA"
          python3 scripts/phase5_acceptance_fixture.py > "$RUNNER_TEMP/acceptance-event.json"
          python3 - "$RUNNER_TEMP/acceptance-event.json" "$GITHUB_ENV" "$RELEASE_ID" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from services.resilio_app.core import event_from_bytes
          event=event_from_bytes(Path(sys.argv[1]).read_bytes(), require_canonical=True)
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              print(f"RELEASE_ID={sys.argv[3]}", file=out)
              print(f"EVENT_ID={event.event_id}", file=out)
              print(f"PAYLOAD_SHA256={event.payload_sha256}", file=out)
          PY

      - name: Authenticate bounded acceptance verifier for product metadata
        id: metadata_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-acceptance@resilio-reference-e882d4.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Resolve and verify exact three service URIs
        id: services
        env:
          TOKEN: ${{ steps.metadata_auth.outputs.access_token }}
        run: |
          set -euo pipefail
          for SERVICE in resilio-ingest resilio-processor resilio-api; do
            URL="https://run.googleapis.com/v2/projects/resilio-reference-e882d4/locations/us-central1/services/$SERVICE"
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "$URL" > "$RUNNER_TEMP/$SERVICE-service.json"
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "$URL:getIamPolicy" > "$RUNNER_TEMP/$SERVICE-policy.json"
            python3 scripts/phase5_supply_chain.py verify-service \
              --service-json "$RUNNER_TEMP/$SERVICE-service.json" \
              --policy-json "$RUNNER_TEMP/$SERVICE-policy.json" \
              --release "$RUNNER_TEMP/release.json" --release-id "$RELEASE_ID" --service "$SERVICE" \
              > "$RUNNER_TEMP/$SERVICE-verified.json"
          done
          INGEST_URI="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uri"])' "$RUNNER_TEMP/resilio-ingest-verified.json")"
          PROCESSOR_URI="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uri"])' "$RUNNER_TEMP/resilio-processor-verified.json")"
          API_URI="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["uri"])' "$RUNNER_TEMP/resilio-api-verified.json")"
          {
            printf 'INGEST_URI=%s\n' "$INGEST_URI"
            printf 'PROCESSOR_URI=%s\n' "$PROCESSOR_URI"
            printf 'API_URI=%s\n' "$API_URI"
          } >> "$GITHUB_ENV"
          {
            printf 'ingest_uri=%s\n' "$INGEST_URI"
            printf 'processor_uri=%s\n' "$PROCESSOR_URI"
            printf 'api_uri=%s\n' "$API_URI"
          } >> "$GITHUB_OUTPUT"

      - name: Mint ingest-only ID token
        id: ingest_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-acceptance@resilio-reference-e882d4.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.services.outputs.ingest_uri }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Mint API-only ID token
        id: api_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-acceptance@resilio-reference-e882d4.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.services.outputs.api_uri }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Prove acceptance deployment state is absent before first submission
        env:
          ID_TOKEN: ${{ steps.api_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          set +e
          HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/api-precondition.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $ID_TOKEN" "$API_URI/v1/deployments/$EVENT_ID")"
          RC=$?
          set -e
          test "$RC" -eq 0
          test "$HTTP" = "404"

      - name: Submit exact reviewed Phase 4-derived observation
        env:
          ID_TOKEN: ${{ steps.ingest_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/acceptance-event.json" \
            "$INGEST_URI/v1/deployments" > "$RUNNER_TEMP/ingest-response.json"
          python3 - "$RUNNER_TEMP/ingest-response.json" "$EVENT_ID" "$PAYLOAD_SHA256" "$GITHUB_ENV" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          assert value.get("event_id")==sys.argv[2]
          assert value.get("payload_sha256")==sys.argv[3]
          assert isinstance(value.get("message_id"),str) and value["message_id"]
          with open(sys.argv[4],"a",encoding="utf-8") as out:
              print(f'MESSAGE_ID={value["message_id"]}',file=out)
          PY

      - name: Read back persisted canonical state
        env:
          ID_TOKEN: ${{ steps.api_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          FOUND=""
          for _ in $(seq 1 30); do
            set +e
            HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/api-first.json" --write-out '%{http_code}' \
              -H "Authorization: Bearer $ID_TOKEN" "$API_URI/v1/deployments/$EVENT_ID")"
            RC=$?
            set -e
            test "$RC" -eq 0
            if test "$HTTP" = "200"; then FOUND=1; break; fi
            test "$HTTP" = "404"
            sleep 2
          done
          test -n "$FOUND"
          python3 scripts/phase5_supply_chain.py acceptance-readback \
            --response-json "$RUNNER_TEMP/api-first.json" \
            --event-id "$EVENT_ID" --payload-sha256 "$PAYLOAD_SHA256" --message-id "$MESSAGE_ID" > "$RUNNER_TEMP/api-first-binding.json"

      - name: Replay exact event and prove stored state is unchanged
        env:
          INGEST_TOKEN: ${{ steps.ingest_auth.outputs.id_token }}
          API_TOKEN: ${{ steps.api_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST -H "Authorization: Bearer $INGEST_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/acceptance-event.json" \
            "$INGEST_URI/v1/deployments" > "$RUNNER_TEMP/ingest-replay.json"
          python3 - "$RUNNER_TEMP/ingest-replay.json" "$MESSAGE_ID" <<'PY'
          import json,sys
          value=json.load(open(sys.argv[1],encoding="utf-8"))
          replay=value.get("message_id")
          assert isinstance(replay,str) and replay and replay != sys.argv[2]
          PY
          sleep 2
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $API_TOKEN" \
            "$API_URI/v1/deployments/$EVENT_ID" > "$RUNNER_TEMP/api-second.json"
          python3 scripts/phase5_supply_chain.py acceptance-readback \
            --response-json "$RUNNER_TEMP/api-second.json" \
            --event-id "$EVENT_ID" --payload-sha256 "$PAYLOAD_SHA256" --message-id "$MESSAGE_ID" > "$RUNNER_TEMP/api-second-binding.json"
          cmp "$RUNNER_TEMP/api-first-binding.json" "$RUNNER_TEMP/api-second-binding.json"
          python3 - "$RUNNER_TEMP/api-first.json" "$RUNNER_TEMP/api-second.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1],encoding="utf-8"))
          b=json.load(open(sys.argv[2],encoding="utf-8"))
          assert a==b
          PY

      - name: Mint processor-audience token for negative invocation proof
        id: processor_auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-acceptance@resilio-reference-e882d4.iam.gserviceaccount.com
          token_format: id_token
          id_token_audience: ${{ steps.services.outputs.processor_uri }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - name: Prove acceptance caller cannot invoke processor
        env:
          ID_TOKEN: ${{ steps.processor_auth.outputs.id_token }}
        run: |
          set -euo pipefail
          set +e
          HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/processor-negative.txt" --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $ID_TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/acceptance-event.json" "$PROCESSOR_URI")"
          RC=$?
          set -e
          test "$RC" -eq 0
          test "$HTTP" = "403"
          printf 'PHASE5_ACCEPTANCE_COMPLETE event_id=%s payload_sha256=%s processor_invocation=DENIED\n' \
            "$EVENT_ID" "$PAYLOAD_SHA256" >> "$GITHUB_STEP_SUMMARY"
