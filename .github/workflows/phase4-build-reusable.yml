name: Phase 4 trusted build reusable

on:
  workflow_call:
    outputs:
      build_id:
        value: ${{ jobs.build.outputs.build_id }}
      source_sha:
        value: ${{ jobs.build.outputs.source_sha }}
      image_digest:
        value: ${{ jobs.build.outputs.image_digest }}

permissions:
  contents: read

jobs:
  build:
    name: trusted-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      build_id: ${{ steps.result.outputs.build_id }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      image_digest: ${{ steps.result.outputs.image_digest }}
    steps:
      - name: Check out immutable trusted control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Resolve current protected main
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "8ft0-ai/resilio"
          test "$GITHUB_REF" = "refs/heads/main"
          SOURCE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'source_sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Recheck main before privileged authentication
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT" = "$SOURCE_SHA"

      - name: Authenticate as bounded build initiator
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p4-build@resilio-control-e882d4.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false

      - name: Recheck main and reuse or create exact build
        id: result
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$CURRENT" = "$SOURCE_SHA"

          LIST="$RUNNER_TEMP/builds.json"
          PAGES="$RUNNER_TEMP/build-pages.json"
          NEXT=""
          rm -f "$RUNNER_TEMP"/build-page-*.json
          for PAGE in $(seq 1 100); do
            printf -v PAGE_FILE '%s/build-page-%03d.json' "$RUNNER_TEMP" "$PAGE"
            if test -n "$NEXT"; then
              curl --fail-with-body --silent --show-error -G \
                -H "Authorization: Bearer $TOKEN" \
                --data-urlencode "pageSize=100" \
                --data-urlencode "pageToken=$NEXT" \
                "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds" > "$PAGE_FILE"
            else
              curl --fail-with-body --silent --show-error -G \
                -H "Authorization: Bearer $TOKEN" \
                --data-urlencode "pageSize=100" \
                "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds" > "$PAGE_FILE"
            fi
            NEXT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("nextPageToken", ""))' "$PAGE_FILE")"
            test -z "$NEXT" && break
          done
          test -z "$NEXT"
          python3 -c 'import glob,json,sys; pages=[json.load(open(p)) for p in sorted(glob.glob(sys.argv[1]))]; json.dump(pages,open(sys.argv[2],"w"),separators=(",",":"))' \
            "$RUNNER_TEMP/build-page-*.json" "$PAGES"
          python3 scripts/phase4_supply_chain.py merge-pages --pages-json "$PAGES" --items-key builds > "$LIST"
          EXISTING="$(python3 scripts/phase4_supply_chain.py select-build --builds-json "$LIST" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA")"

          BUILD_JSON="$RUNNER_TEMP/build.json"
          if test -n "$EXISTING"; then
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $TOKEN" \
              "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds/$EXISTING" > "$BUILD_JSON"
          else
            REQUEST="$RUNNER_TEMP/build-request.json"
            python3 scripts/phase4_supply_chain.py build-request --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" > "$REQUEST"
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data-binary "@$REQUEST" \
              "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds" > "$BUILD_JSON"
            BUILD_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$BUILD_JSON")"
            for _ in $(seq 1 60); do
              curl --fail-with-body --silent --show-error \
                -H "Authorization: Bearer $TOKEN" \
                "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds/$BUILD_ID" > "$BUILD_JSON"
              STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$BUILD_JSON")"
              case "$STATUS" in
                SUCCESS|FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) break ;;
              esac
              sleep 10
            done
          fi

          RESULT="$RUNNER_TEMP/result.json"
          python3 scripts/phase4_supply_chain.py validate-build --build-json "$BUILD_JSON" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" > "$RESULT"
          BUILD_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["build_id"])' "$RESULT")"
          IMAGE_DIGEST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image_digest"])' "$RESULT")"
          printf 'build_id=%s\n' "$BUILD_ID" >> "$GITHUB_OUTPUT"
          printf 'image_digest=%s\n' "$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
