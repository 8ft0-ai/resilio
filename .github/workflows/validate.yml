name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8

      - name: Validate repository invariants
        run: python3 scripts/validate_repo.py

      - name: Validate cloud bootstrap contract
        run: python3 scripts/validate_cloud_bootstrap.py

      - name: Validate Terraform control seed
        run: python3 scripts/validate_terraform_control.py

      - name: Validate Phase 4 supply-chain controls
        run: python3 scripts/validate_phase4_supply_chain.py

      - name: Validate normal Terraform callers
        run: python3 scripts/validate_terraform_callers.py

      - name: Validate Phase 5 trusted product/control seed
        run: python3 scripts/validate_phase5_slice_a.py

      - name: Validate Phase 5 Slice B authority/state-domain declaration
        run: python3 scripts/validate_phase5_slice_b.py

      - name: Validate generated Phase 5 product Terraform configurations
        run: python3 scripts/validate_phase5_terraform_seed.py

      - name: Verify reviewed Phase 4-derived acceptance fixture
        run: python3 scripts/phase5_acceptance_fixture.py > /dev/null

      - name: Smoke-test the built Phase 5 product image
        run: |
          set -euo pipefail
          docker build --network=none -f services/resilio_app/Dockerfile -t phase5-slice-a-smoke .
          for COMPONENT in ingest processor api; do
            NAME="phase5-$COMPONENT-smoke"
            docker run -d --rm --network=none --name "$NAME" \
              -e RESILIO_COMPONENT="$COMPONENT" \
              -e GOOGLE_CLOUD_PROJECT=resilio-reference-e882d4 phase5-slice-a-smoke >/dev/null
            READY=""
            for _ in $(seq 1 20); do
              if docker exec "$NAME" /usr/bin/python3 -c 'import json,urllib.request; r=urllib.request.urlopen("http://127.0.0.1:8080/health",timeout=1); assert r.status == 200; assert json.load(r) == {"status":"ok"}' >/dev/null 2>&1; then
                READY=1
                break
              fi
              sleep 1
            done
            if test -z "$READY"; then
              docker logs "$NAME" >&2 || true
              docker rm -f "$NAME" >/dev/null 2>&1 || true
              exit 1
            fi
            docker stop "$NAME" >/dev/null
          done
          set +e
          docker run --rm --network=none \
            -e RESILIO_COMPONENT=invalid \
            -e GOOGLE_CLOUD_PROJECT=resilio-reference-e882d4 phase5-slice-a-smoke >/tmp/invalid-component.log 2>&1
          RC=$?
          set -e
          test "$RC" -ne 0

      - name: Run repository unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Run Phase 4 proof-service tests
        run: python3 services/phase4-proof/test_app.py

      - name: Check bootstrap Terraform formatting
        run: terraform -chdir=infra/bootstrap fmt -check -recursive

      - name: Initialise bootstrap Terraform without a backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate bootstrap Terraform configuration
        run: terraform -chdir=infra/bootstrap validate

      - name: Check foundation Terraform formatting
        run: terraform -chdir=infra/foundation fmt -check -recursive

      - name: Initialise foundation Terraform without a backend
        run: terraform -chdir=infra/foundation init -backend=false -input=false -lockfile=readonly

      - name: Validate foundation Terraform configuration
        run: terraform -chdir=infra/foundation validate
