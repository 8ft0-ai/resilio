name: Validate repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8

      - name: Validate repository invariants
        run: python3 scripts/validate_repo.py

      - name: Validate cloud bootstrap contract
        run: python3 scripts/validate_cloud_bootstrap.py

      - name: Validate Terraform control seed
        run: python3 scripts/validate_terraform_control.py

      - name: Run Terraform control unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Check bootstrap Terraform formatting
        run: terraform -chdir=infra/bootstrap fmt -check -recursive

      - name: Initialise bootstrap Terraform without a backend
        run: terraform -chdir=infra/bootstrap init -backend=false -input=false -lockfile=readonly

      - name: Validate bootstrap Terraform configuration
        run: terraform -chdir=infra/bootstrap validate

      - name: Check foundation Terraform formatting
        run: terraform -chdir=infra/foundation fmt -check -recursive

      - name: Initialise foundation Terraform without a backend
        run: terraform -chdir=infra/foundation init -backend=false -input=false -lockfile=readonly

      - name: Validate foundation Terraform configuration
        run: terraform -chdir=infra/foundation validate
