name: Generate Terraform lock (temporary)

on:
  push:
    branches:
      - m0/gcp-bootstrap-foundation

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8

      - name: Generate and print provider lock
        run: |
          terraform -chdir=infra/bootstrap init -backend=false -input=false
          cat infra/bootstrap/.terraform.lock.hcl
