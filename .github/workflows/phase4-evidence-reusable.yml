name: Phase 4 evidence reusable

on:
  workflow_call:
    inputs:
      build_id:
        required: true
        type: string
    outputs:
      evidence_object:
        value: ${{ jobs.evidence.outputs.evidence_object }}
      image:
        value: ${{ jobs.evidence.outputs.image }}

permissions:
  contents: read

jobs:
  evidence:
    name: adjudicate-exact-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      id-token: write
    outputs:
      evidence_object: ${{ steps.result.outputs.evidence_object }}
      image: ${{ steps.result.outputs.image }}
    steps:
      - name: Check out immutable trusted control code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Authenticate as evidence adjudicator
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p4-evidence@resilio-control-e882d4.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false

      - name: Adjudicate build, scan, provenance and SBOM
        id: result
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          BUILD_ID: ${{ inputs.build_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_ID" =~ ^[0-9a-f-]{8,64}$ ]]

          artifact_analysis_request() {
            local REQUEST_CATEGORY="$1"
            local RESPONSE_FILE="$2"
            shift 2
            local HTTP_STATUS_FILE="$RESPONSE_FILE.http-status"
            local CURL_STDERR_FILE="$RESPONSE_FILE.curl-stderr"
            local HTTP_STATUS=""
            local CURL_EXIT_CODE=0
            rm -f "$RESPONSE_FILE" "$HTTP_STATUS_FILE" "$CURL_STDERR_FILE"
            if HTTP_STATUS="$(curl --silent --show-error --output "$RESPONSE_FILE" \
              --write-out '%{http_code}' "$@" 2> "$CURL_STDERR_FILE")"; then
              CURL_EXIT_CODE=0
            else
              CURL_EXIT_CODE=$?
            fi
            printf '%s\n' "$HTTP_STATUS" > "$HTTP_STATUS_FILE"
            python3 scripts/phase4_supply_chain.py google-api-response \
              --response-json "$RESPONSE_FILE" \
              --http-status-file "$HTTP_STATUS_FILE" \
              --curl-exit-code "$CURL_EXIT_CODE" \
              --request-category "$REQUEST_CATEGORY" \
              --workflow-run-id "$GITHUB_RUN_ID" \
              --preserved-build-id "$BUILD_ID"
          }

          collect_occurrences() {
            local FILTER="$1"
            local PREFIX="$2"
            local REQUEST_CATEGORY="$3"
            local OUT="$4"
            local LOCATION="${5:-}"
            local NEXT=""
            local PAGE_FILE=""
            local PAGES="$RUNNER_TEMP/$PREFIX-pages.json"
            local ENDPOINT="https://containeranalysis.googleapis.com"
            local PARENT="projects/resilio-control-e882d4"
            if test -n "$LOCATION"; then
              test "$LOCATION" = "us-central1"
              ENDPOINT="https://containeranalysis.$LOCATION.rep.googleapis.com"
              PARENT="$PARENT/locations/$LOCATION"
            fi
            rm -f "$RUNNER_TEMP"/"$PREFIX"-page-*.json
            for PAGE in $(seq 1 100); do
              printf -v PAGE_FILE '%s/%s-page-%03d.json' "$RUNNER_TEMP" "$PREFIX" "$PAGE"
              if test -n "$NEXT"; then
                artifact_analysis_request "$REQUEST_CATEGORY" "$PAGE_FILE" -G \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "X-Goog-User-Project: resilio-control-e882d4" \
                  --data-urlencode "filter=$FILTER" \
                  --data-urlencode "pageSize=1000" \
                  --data-urlencode "pageToken=$NEXT" \
                  "$ENDPOINT/v1/$PARENT/occurrences"
              else
                artifact_analysis_request "$REQUEST_CATEGORY" "$PAGE_FILE" -G \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "X-Goog-User-Project: resilio-control-e882d4" \
                  --data-urlencode "filter=$FILTER" \
                  --data-urlencode "pageSize=1000" \
                  "$ENDPOINT/v1/$PARENT/occurrences"
              fi
              NEXT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("nextPageToken", ""))' "$PAGE_FILE")"
              test -z "$NEXT" && break
            done
            test -z "$NEXT"
            python3 -c 'import glob,json,sys; pages=[json.load(open(p)) for p in sorted(glob.glob(sys.argv[1]))]; json.dump(pages,open(sys.argv[2],"w"),separators=(",",":"))' \
              "$RUNNER_TEMP/$PREFIX-page-*.json" "$PAGES"
            python3 scripts/phase4_supply_chain.py merge-pages --pages-json "$PAGES" --items-key occurrences > "$OUT"
          }

          BUILD="$RUNNER_TEMP/build.json"
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
            "https://cloudbuild.googleapis.com/v1/projects/resilio-control-e882d4/builds/$BUILD_ID" > "$BUILD"

          IDENTITY="$RUNNER_TEMP/identity.json"
          python3 scripts/phase4_supply_chain.py build-identity --build-json "$BUILD" > "$IDENTITY"
          SOURCE_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["source_sha"])' "$IDENTITY")"
          WORKFLOW_SHA="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["workflow_sha"])' "$IDENTITY")"
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          python3 scripts/phase4_evidence_recovery.py \
            --build-id "$BUILD_ID" \
            --source-sha "$SOURCE_SHA" \
            --build-control-sha "$WORKFLOW_SHA" \
            --current-main-sha "$CURRENT"
          SOURCE_TREE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$SOURCE_SHA" --jq .tree.sha)"
          [[ "$SOURCE_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]

          RESULT="$RUNNER_TEMP/build-result.json"
          python3 scripts/phase4_evidence_readback.py --build-json "$BUILD" --source-sha "$SOURCE_SHA" --workflow-sha "$WORKFLOW_SHA" > "$RESULT"
          IMAGE="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["image"])' "$RESULT")"
          RESOURCE_URL="https://$IMAGE"

          DISC="$RUNNER_TEMP/discovery.json"
          VULN="$RUNNER_TEMP/vulnerabilities.json"
          DISP=""
          for _ in $(seq 1 30); do
            collect_occurrences "(kind=\"DISCOVERY\" AND resourceUrl=\"$RESOURCE_URL\")" discovery DISCOVERY "$DISC"
            collect_occurrences "(kind=\"VULNERABILITY\" AND resourceUrl=\"$RESOURCE_URL\")" vulnerability VULNERABILITY "$VULN"
            if DISP="$(python3 scripts/phase4_supply_chain.py scan-disposition --discovery-json "$DISC" --vulnerability-json "$VULN" 2>/dev/null)"; then break; fi
            sleep 10
          done
          test -n "$DISP"
          test "$DISP" != "FAIL_CRITICAL"
          if test "$DISP" = "HIGH_REVIEW_REQUIRED"; then
            COMMENTS="$RUNNER_TEMP/high-comments.json"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/28/comments?per_page=100" > "$COMMENTS"
            python3 scripts/phase4_supply_chain.py check-high-acceptance --comments-json "$COMMENTS" --image "$IMAGE"
            DISP=PASS
          fi
          test "$DISP" = "PASS"

          PROV="$RUNNER_TEMP/provenance.json"
          collect_occurrences "(kind=\"BUILD\" AND resourceUrl=\"$RESOURCE_URL\")" provenance PROVENANCE "$PROV"
          PROV_OCC="$(python3 scripts/phase4_supply_chain.py provenance-occurrence --occurrences-json "$PROV" --build-id "$BUILD_ID")"

          GENERATOR_SPEC="$RUNNER_TEMP/sbom-generator.json"
          python3 scripts/phase4_repository_sbom.py generator-spec > "$GENERATOR_SPEC"
          SYFT_URL="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"])' "$GENERATOR_SPEC")"
          SYFT_ASSET="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["asset"])' "$GENERATOR_SPEC")"
          SYFT_ARCHIVE="$RUNNER_TEMP/$SYFT_ASSET"
          SYFT_DIR="$RUNNER_TEMP/syft"
          mkdir -m 0700 "$SYFT_DIR"
          curl --fail-with-body --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$SYFT_URL" > "$SYFT_ARCHIVE"
          python3 scripts/phase4_repository_sbom.py verify-archive --archive "$SYFT_ARCHIVE"
          tar -xzf "$SYFT_ARCHIVE" -C "$SYFT_DIR" syft
          SYFT_BIN="$SYFT_DIR/syft"
          test -x "$SYFT_BIN"
          SYFT_VERSION="$RUNNER_TEMP/syft-version.txt"
          "$SYFT_BIN" version > "$SYFT_VERSION"
          python3 scripts/phase4_repository_sbom.py verify-version --version-file "$SYFT_VERSION"

          SBOM_CONTENT="$RUNNER_TEMP/sbom.spdx.json"
          SBOM_SYFT_JSON="$RUNNER_TEMP/sbom.syft.json"
          SYFT_REGISTRY_AUTH_AUTHORITY="us-central1-docker.pkg.dev" \
          SYFT_REGISTRY_AUTH_USERNAME="oauth2accesstoken" \
          SYFT_REGISTRY_AUTH_PASSWORD="$TOKEN" \
            "$SYFT_BIN" "$IMAGE" \
              -o "spdx-json=$SBOM_CONTENT" \
              -o "syft-json=$SBOM_SYFT_JSON"
          test -s "$SBOM_CONTENT"
          test -s "$SBOM_SYFT_JSON"
          python3 scripts/phase4_repository_sbom.py verify-resolved-digest \
            --image "$IMAGE" --syft-json "$SBOM_SYFT_JSON"

          SBOM_OBJECT="$(python3 scripts/phase4_repository_sbom.py object --build-id "$BUILD_ID")"
          ENCODED_SBOM_OBJECT="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$SBOM_OBJECT")"
          SBOM_UPLOAD="$RUNNER_TEMP/sbom-upload.json"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$SBOM_CONTENT" \
            "https://storage.googleapis.com/upload/storage/v1/b/resilio-control-e882d4-phase4-evidence/o?uploadType=media&name=$ENCODED_SBOM_OBJECT&ifGenerationMatch=0" \
            > "$SBOM_UPLOAD"

          SBOM_GENERATION="$(python3 scripts/phase4_repository_sbom.py generation \
            --build-id "$BUILD_ID" --metadata-json "$SBOM_UPLOAD")"
          [[ "$SBOM_GENERATION" =~ ^[1-9][0-9]*$ ]]

          SBOM_READBACK_METADATA="$RUNNER_TEMP/sbom-readback-metadata.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/resilio-control-e882d4-phase4-evidence/o/$ENCODED_SBOM_OBJECT?generation=$SBOM_GENERATION" \
            > "$SBOM_READBACK_METADATA"

          SBOM_READBACK_CONTENT="$RUNNER_TEMP/sbom-readback.spdx.json"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/download/storage/v1/b/resilio-control-e882d4-phase4-evidence/o/$ENCODED_SBOM_OBJECT?generation=$SBOM_GENERATION&alt=media" \
            > "$SBOM_READBACK_CONTENT"
          test -s "$SBOM_READBACK_CONTENT"

          BOUND_SBOM="$RUNNER_TEMP/bound-sbom.json"
          python3 scripts/phase4_repository_sbom.py bind \
            --image "$IMAGE" --build-id "$BUILD_ID" --syft-json "$SBOM_SYFT_JSON" \
            --upload-metadata-json "$SBOM_UPLOAD" \
            --readback-metadata-json "$SBOM_READBACK_METADATA" \
            --content-file "$SBOM_CONTENT" --readback-file "$SBOM_READBACK_CONTENT" \
            --output "$BOUND_SBOM"

          MANIFEST="$RUNNER_TEMP/transition.json"
          python3 scripts/phase4_supply_chain.py make-transition \
            --build-result "$RESULT" --source-tree-sha "$SOURCE_TREE_SHA" \
            --provenance-occurrence "$PROV_OCC" --sbom-json "$BOUND_SBOM" --output "$MANIFEST"
          python3 scripts/phase4_supply_chain.py validate-transition --manifest "$MANIFEST"
          python3 scripts/phase4_repository_sbom.py validate-transition \
            --manifest "$MANIFEST" --image "$IMAGE" --build-id "$BUILD_ID" \
            --syft-json "$SBOM_SYFT_JSON" --content-file "$SBOM_CONTENT" \
            --readback-file "$SBOM_READBACK_CONTENT"

          OBJECT="transitions/$BUILD_ID.json"
          ENCODED_OBJECT="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1],safe=""))' "$OBJECT")"
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data-binary "@$MANIFEST" \
            "https://storage.googleapis.com/upload/storage/v1/b/resilio-control-e882d4-phase4-evidence/o?uploadType=media&name=$ENCODED_OBJECT&ifGenerationMatch=0" > "$RUNNER_TEMP/upload.json"
          printf 'evidence_object=%s\n' "$OBJECT" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"
