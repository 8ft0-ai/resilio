name: Phase 5 product Terraform plan caller

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Exact product-candidate pull request number
        required: true
        type: number
      candidate_sha:
        description: Exact product-candidate head SHA
        required: true
        type: string
      base_sha:
        description: Exact product-candidate base SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  plan:
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    uses: 8ft0-ai/resilio/.github/workflows/phase5-terraform-plan-reusable.yml@47b3b17d32ffebf3ce8e9b7d15bc3d3539dc7239
    with:
      pr_number: ${{ fromJSON(inputs.pr_number) }}
      candidate_sha: ${{ inputs.candidate_sha }}
      base_sha: ${{ inputs.base_sha }}
