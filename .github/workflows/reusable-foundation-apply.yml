name: Reusable foundation Terraform applier

on:
  workflow_call:
    inputs:
      mode: {required: true, type: string}
      desired_sha: {required: true, type: string}
      candidate_blob_sha: {required: false, default: "", type: string}
      reviewed_head_sha: {required: false, default: "", type: string}
      reviewed_evidence_object: {required: false, default: "", type: string}
      reviewed_evidence_generation: {required: false, default: "", type: string}
    outputs:
      state_generation: {value: "${{ jobs.apply.outputs.state_generation }}"}
      state_serial: {value: "${{ jobs.apply.outputs.state_serial }}"}
      state_lineage_digest: {value: "${{ jobs.apply.outputs.state_lineage_digest }}"}

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-foundation
  cancel-in-progress: false
  queue: max

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      state_generation: ${{ steps.result.outputs.state_generation }}
      state_serial: ${{ steps.result.outputs.state_serial }}
      state_lineage_digest: ${{ steps.result.outputs.state_lineage_digest }}
    steps:
      - name: Validate immutable workflow and mode
        env:
          MODE: ${{ inputs.mode }}
          SHA: ${{ inputs.desired_sha }}
          BLOB: ${{ inputs.candidate_blob_sha }}
          RH: ${{ inputs.reviewed_head_sha }}
          EO: ${{ inputs.reviewed_evidence_object }}
          EG: ${{ inputs.reviewed_evidence_generation }}
          WREPO: ${{ job.workflow_repository }}
          WSHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$WREPO" = "8ft0-ai/resilio"
          printf '%s' "$WSHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'
          case "$MODE" in
            setup) test -z "$BLOB$RH$EO$EG" ;;
            apply)
              printf '%s' "$BLOB" | grep -Eq '^[0-9a-f]{40}$'
              printf '%s' "$RH" | grep -Eq '^[0-9a-f]{40}$'
              test "$RH" = "$SHA"
              [[ "$EO" = plan-evidence/foundation/* ]]
              [[ "$EG" =~ ^[0-9]+$ ]] ;;
            *) exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Assemble trusted Terraform working directory
        env:
          MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.desired_sha }}
          BLOB: ${{ inputs.candidate_blob_sha }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/foundation"; rm -rf "$W"; mkdir -p "$W"
          cp infra/foundation/{backend.tf,versions.tf,provider.tf,.terraform.lock.hcl} "$W/"
          if [ "$MODE" = setup ]; then
            cp infra/foundation/resources.tf.json "$W/resources.tf.json"
            python3 scripts/terraform_control.py validate-candidate --path "$W/resources.tf.json"
          else
            python3 scripts/terraform_control.py fetch-candidate --ref "$SHA" --expected-blob-sha "$BLOB" --output "$W/resources.tf.json"
            python3 scripts/terraform_control.py validate-candidate --path "$W/resources.tf.json" --require-sentinel
          fi

      - name: Authenticate bounded applier
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: resilio-control-e882d4
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-foundation-applier@resilio-control-e882d4.iam.gserviceaccount.com
          access_token_lifetime: 300s
          create_credentials_file: true
          export_environment_variables: true

      - name: Initialise empty remote state once
        if: inputs.mode == 'setup'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/foundation"
          python3 scripts/terraform_control.py gcs-assert-absent
          terraform -chdir="$W" init -input=false -lockfile=readonly >/dev/null
          terraform -chdir="$W" state pull >"$RUNNER_TEMP/result-state.json"
          python3 scripts/terraform_control.py gcs-metadata >"$RUNNER_TEMP/result-meta.json"

      - name: Verify reviewed effect and apply fresh main plan
        if: inputs.mode == 'apply'
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EO: ${{ inputs.reviewed_evidence_object }}
          EG: ${{ inputs.reviewed_evidence_generation }}
          RH: ${{ inputs.reviewed_head_sha }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/foundation"
          terraform -chdir="$W" init -input=false -lockfile=readonly >/dev/null
          python3 scripts/terraform_control.py download-evidence --object "$EO" --generation "$EG" --output "$RUNNER_TEMP/reviewed.json"
          terraform -chdir="$W" state pull >"$RUNNER_TEMP/pre-state.json"
          python3 scripts/terraform_control.py gcs-metadata >"$RUNNER_TEMP/pre-meta.json"
          G="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP/pre-meta.json"'"))["generation"])')"
          terraform -chdir="$W" plan -input=false -lock-timeout=60s -out="$RUNNER_TEMP/fresh-plan" >/dev/null
          terraform -chdir="$W" show -json "$RUNNER_TEMP/fresh-plan" >"$RUNNER_TEMP/fresh-plan.json"
          python3 scripts/terraform_control.py verify-reviewed --reviewed-evidence "$RUNNER_TEMP/reviewed.json" --plan-json "$RUNNER_TEMP/fresh-plan.json" --state-json "$RUNNER_TEMP/pre-state.json" --state-generation "$G" --reviewed-head-sha "$RH"
          terraform -chdir="$W" apply -input=false "$RUNNER_TEMP/fresh-plan" >/dev/null
          set +e
          terraform -chdir="$W" plan -input=false -lock-timeout=60s -detailed-exitcode >/dev/null
          RC=$?
          set -e
          test "$RC" -eq 0
          terraform -chdir="$W" state pull >"$RUNNER_TEMP/result-state.json"
          python3 scripts/terraform_control.py gcs-metadata >"$RUNNER_TEMP/result-meta.json"

      - name: Publish non-sensitive state identity
        id: result
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/result-state.json"; test -s "$RUNNER_TEMP/result-meta.json"
          python3 - "$RUNNER_TEMP/result-state.json" "$RUNNER_TEMP/result-meta.json" "$GITHUB_OUTPUT" <<'PY'
          import hashlib,json,sys
          state=json.load(open(sys.argv[1])); meta=json.load(open(sys.argv[2]))
          lineage=state["lineage"]; serial=state["serial"]; generation=meta["generation"]
          with open(sys.argv[3],"a") as out:
              out.write(f"state_generation={generation}\n")
              out.write(f"state_serial={serial}\n")
              out.write(f"state_lineage_digest={hashlib.sha256(lineage.encode()).hexdigest()}\n")
          PY
