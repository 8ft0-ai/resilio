name: Phase 5 product independent verifier caller

on:
  workflow_dispatch:
    inputs:
      release_record_comment_id:
        description: Exact reviewed release-record comment ID
        required: true
        type: string
      d5_reconciliation_comment_id:
        description: Exact successful D.5 IAM reconciliation comment ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: 8ft0-ai/resilio/.github/workflows/phase5-verify-reusable.yml@9513cd2a93241a8f870d85b4261102327574da5b
    with:
      release_record_comment_id: ${{ inputs.release_record_comment_id }}
      d5_reconciliation_comment_id: ${{ inputs.d5_reconciliation_comment_id }}
