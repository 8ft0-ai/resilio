name: Phase 5 product create-only deployment caller

on:
  workflow_dispatch:
    inputs:
      authority_comment_id:
        description: Exact owner deployment-authority comment ID
        required: true
        type: string
      release_record_comment_id:
        description: Exact reviewed release-record comment ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: 8ft0-ai/resilio/.github/workflows/phase5-deploy-reusable.yml@9513cd2a93241a8f870d85b4261102327574da5b
    with:
      authority_comment_id: ${{ inputs.authority_comment_id }}
      release_record_comment_id: ${{ inputs.release_record_comment_id }}
