name: Phase 5 Slice C successor reconciliation-only recovery reusable

on:
  workflow_call:

permissions:
  contents: read
  issues: read
  actions: read
  pull-requests: read

jobs:
  recover:
    name: slice-c-recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: read
      actions: read
      pull-requests: read
      id-token: write
    steps:
      - name: Check out immutable recovery control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Set up exact Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Bind exact incident, activation and owner authority before OIDC
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTIVATION_SHA: ${{ github.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 scripts/phase5_slice_c_recovery.py verify-caller \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --ref-protected "$GITHUB_REF_PROTECTED" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --activation-sha "$ACTIVATION_SHA" \
            --control-sha "$CONTROL_SHA"
          python3 scripts/phase5_slice_c_recovery.py verify-successor-github-boundary \
            --activation-sha "$ACTIVATION_SHA" \
            --control-sha "$CONTROL_SHA" \
            --candidate-output "$RUNNER_TEMP/recovery-candidate.json" \
            > "$RUNNER_TEMP/recovery-github-boundary.json"
          python3 scripts/phase5_terraform_control.py assemble \
            --trusted-root "$GITHUB_WORKSPACE" \
            --candidate "$RUNNER_TEMP/recovery-candidate.json" \
            --output "$RUNNER_TEMP/product" \
            > "$RUNNER_TEMP/recovery-assembly.json"

      - name: Authenticate bounded product planner
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          project_id: resilio-control-e882d4
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-product-planner@resilio-control-e882d4.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: true
          export_environment_variables: true

      - name: Verify repaired product state and predecessor claim before successor claim
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 scripts/phase5_slice_c_recovery.py verify-successor-cloud-boundary \
            --control-sha "$CONTROL_SHA" \
            > "$RUNNER_TEMP/recovery-successor-cloud-boundary.json"

      - name: Consume immutable one-shot successor recovery claim
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ACTIVATION_SHA: ${{ github.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          python3 scripts/phase5_slice_c_recovery.py successor-claim \
            --activation-sha "$ACTIVATION_SHA" \
            --control-sha "$CONTROL_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --github-boundary "$RUNNER_TEMP/recovery-github-boundary.json" \
            > "$RUNNER_TEMP/recovery-claim-upload.json"

      - name: Reconcile exact accepted state without apply
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ACTIVATION_SHA: ${{ github.sha }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/product"
          PLAN_WORK="$RUNNER_TEMP/recovery-plan-workdir"
          PRE_STATE="$RUNNER_TEMP/recovery-state-before.json"
          PRE_ID="$RUNNER_TEMP/recovery-state-before-id.json"
          POST_STATE="$RUNNER_TEMP/recovery-state-after.json"
          POST_ID="$RUNNER_TEMP/recovery-state-after-id.json"
          PLAN="$RUNNER_TEMP/recovery.tfplan"
          PLAN_JSON="$RUNNER_TEMP/recovery-plan.json"
          PRIVATE="$RUNNER_TEMP/recovery-result-private.json"
          PUBLIC="$RUNNER_TEMP/recovery-result-public.json"

          META="$(python3 scripts/phase5_terraform_control.py gcs-metadata \
            --object product/default.tfstate)"
          GENERATION="$(printf '%s' "$META" | python3 -c \
            'import json,sys; print(json.load(sys.stdin)["generation"])')"
          test "$GENERATION" = "1791024916608689"

          LOCK="$(python3 scripts/phase5_terraform_control.py gcs-metadata \
            --object product/default.tflock --allow-absent)"
          test "$LOCK" = "ABSENT"

          python3 scripts/phase5_terraform_control.py prepare-plan-workdir \
            --assembled-root "$WORK" \
            --generation "$GENERATION" \
            --output "$PLAN_WORK" \
            > "$RUNNER_TEMP/recovery-plan-workdir.json"

          terraform -chdir="$PLAN_WORK" init -input=false -lockfile=readonly >/dev/null
          terraform -chdir="$PLAN_WORK" state pull > "$PRE_STATE"
          python3 scripts/phase5_slice_c_recovery.py successor-state-identity \
            --state-json "$PRE_STATE" \
            --generation "$GENERATION" \
            --output "$PRE_ID"
          python3 scripts/phase5_slice_c_recovery.py verify-successor-state --file "$PRE_ID"

          set +e
          terraform -chdir="$PLAN_WORK" plan \
            -input=false -detailed-exitcode -out="$PLAN" >/dev/null
          PLAN_RC=$?
          set -e
          test "$PLAN_RC" -eq 0

          terraform -chdir="$PLAN_WORK" show -json "$PLAN" > "$PLAN_JSON"
          python3 scripts/phase5_slice_c_recovery.py verify-successor-plan --file "$PLAN_JSON"

          terraform -chdir="$PLAN_WORK" state pull > "$POST_STATE"
          python3 scripts/phase5_slice_c_recovery.py successor-state-identity \
            --state-json "$POST_STATE" \
            --generation "$GENERATION" \
            --output "$POST_ID"
          python3 scripts/phase5_slice_c_recovery.py verify-successor-state --file "$POST_ID"
          cmp "$PRE_ID" "$POST_ID"

          POST_META="$(python3 scripts/phase5_terraform_control.py gcs-metadata \
            --object product/default.tfstate)"
          test "$POST_META" = "$META"
          POST_LOCK="$(python3 scripts/phase5_terraform_control.py gcs-metadata \
            --object product/default.tflock --allow-absent)"
          test "$POST_LOCK" = "ABSENT"

          python3 scripts/phase5_slice_c_recovery.py build-successor-result \
            --before "$PRE_ID" \
            --after "$POST_ID" \
            --plan-json "$PLAN_JSON" \
            --activation-sha "$ACTIVATION_SHA" \
            --control-sha "$CONTROL_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --github-boundary "$RUNNER_TEMP/recovery-github-boundary.json" \
            --private-output "$PRIVATE" \
            --public-output "$PUBLIC"
          python3 scripts/phase5_slice_c_recovery.py upload-successor-result \
            --control-sha "$CONTROL_SHA" \
            --file "$PRIVATE" \
            > "$RUNNER_TEMP/recovery-result-upload.json"
          cat "$PUBLIC"

      - name: Remove generated WIF credential material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE"/gha-creds-*.json "$RUNNER_TEMP"/gha-creds-*.json
