name: Phase 5 product independent verification reusable

on:
  workflow_call:
    inputs:
      release_record_comment_id:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verify-three-product-services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - name: Check out immutable Slice A control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false

      - name: Bind reviewed release before verifier OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RECORD_COMMENT_ID: ${{ inputs.release_record_comment_id }}
          CONTROL_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "8ft0-ai/resilio"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_PROTECTED" = "true"
          [[ "$RELEASE_RECORD_COMMENT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/issues/comments/$RELEASE_RECORD_COMMENT_ID" > "$RUNNER_TEMP/release-record.json"
          python3 scripts/phase5_release_record.py validate \
            --comment-json "$RUNNER_TEMP/release-record.json" --comment-id "$RELEASE_RECORD_COMMENT_ID" \
            --output "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/release-meta.json"
          RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release_id"])' "$RUNNER_TEMP/release-meta.json")"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["control_sha"])' "$RUNNER_TEMP/release.json")" = "$CONTROL_SHA"
          printf 'RELEASE_ID=%s\n' "$RELEASE_ID" >> "$GITHUB_ENV"

      - name: Authenticate bounded Phase 5 acceptance verifier for metadata readback
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/400271474382/locations/global/workloadIdentityPools/github/providers/resilio
          service_account: github-p5-acceptance@resilio-reference-e882d4.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify exact product service, IAM and revision state
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          for SERVICE in resilio-ingest resilio-processor resilio-api; do
            SERVICE_URL="https://run.googleapis.com/v2/projects/resilio-reference-e882d4/locations/us-central1/services/$SERVICE"
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL" > "$RUNNER_TEMP/$SERVICE-service.json"
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "$SERVICE_URL:getIamPolicy" > "$RUNNER_TEMP/$SERVICE-policy.json"
            python3 scripts/phase5_supply_chain.py verify-service \
              --service-json "$RUNNER_TEMP/$SERVICE-service.json" --policy-json "$RUNNER_TEMP/$SERVICE-policy.json" \
              --release "$RUNNER_TEMP/release.json" --release-id "$RELEASE_ID" --service "$SERVICE" \
              > "$RUNNER_TEMP/$SERVICE-verified.json"
            REVISION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["revision"])' "$RUNNER_TEMP/$SERVICE-verified.json")"
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer $TOKEN" \
              "https://run.googleapis.com/v2/$REVISION" > "$RUNNER_TEMP/$SERVICE-revision.json"
            python3 scripts/phase5_supply_chain.py verify-revision \
              --revision-json "$RUNNER_TEMP/$SERVICE-revision.json" \
              --release "$RUNNER_TEMP/release.json" --release-id "$RELEASE_ID" --service "$SERVICE"
            printf 'verified=%s revision=%s\n' "$SERVICE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Prove Phase 5 metadata envelope does not extend to Phase 4 proof
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          set +e
          HTTP="$(curl --silent --show-error --output "$RUNNER_TEMP/phase4-negative.json" --write-out '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            "https://run.googleapis.com/v2/projects/resilio-reference-e882d4/locations/us-central1/services/phase4-proof")"
          RC=$?
          set -e
          test "$RC" -eq 0
          test "$HTTP" = "403"
          printf 'phase4_metadata_read=DENIED\n' >> "$GITHUB_STEP_SUMMARY"
